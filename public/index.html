<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高考作文批改器 · 更新分发</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #1e293b; }
  .hero { background: linear-gradient(120deg, #1e3a8a, #2563eb 55%, #7c3aed); color: #fff; padding: 48px 20px; text-align: center; }
  .hero h1 { margin: 0 0 6px; font-size: 28px; }
  .hero p { margin: 0; opacity: .8; }
  .card { max-width: 560px; margin: -24px auto 20px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(15,23,42,.1); }
  .ver { display: inline-block; background: #16a34a; color: #fff; border-radius: 999px; padding: 3px 16px; font-weight: 700; }
  ul { margin: 14px 0; padding-left: 20px; color: #475569; }
  .btn { display: block; text-align: center; background: linear-gradient(120deg, #2563eb, #7c3aed); color: #fff; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 16px; }
  .hint { text-align: center; color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>
  <div class="hero"><h1>高考作文批改器</h1><p>Android 客户端更新分发</p></div>
  <div class="card">
    <span class="ver" id="ver">加载中…</span>
    <h3>更新内容</h3>
    <ul id="notes"><li>加载中…</li></ul>
    <a class="btn" id="dl" href="#">下载最新版 APK</a>
  </div>
  <p class="hint">手机浏览器打开本页可直接下载安装；APP 内也会自动检查更新。</p>
<script>
fetch('update.json').then(r => r.json()).then(d => {
  document.getElementById('ver').textContent = '最新版 v' + d.versionName;
  document.getElementById('notes').innerHTML = d.notes.map(n => '<li>' + n + '</li>').join('');
  document.getElementById('dl').href = d.apkUrl;
}).catch(() => { document.getElementById('ver').textContent = '暂无版本信息'; });
</script>
</body>
</html>
